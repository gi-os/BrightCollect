name: Check

# Compiles and tests without publishing anything.
#
# The point of this workflow is that a push to main cuts a release, so main is a bad place
# to find out that something doesn't compile. Any other branch runs this instead, which is
# the same build minus the signing checks and the release.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # light-common is pulled from GitHub Packages, which has no anonymous read.
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Unit tests
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      # The release build too, which the other repos leave to build.yml on main. It is here
      # because everything that can go wrong in this app's packaging is release-only: R8 full
      # mode against ONNX Runtime's JNI entry points, resource shrinking, and the model asset.
      # A push to main cuts a public release, so "does the shipping configuration work" is not
      # a question to first ask there.
      - name: Verify the release package
        run: |
          # Globbed, not spelled out. A release with no keystore secret is named
          # app-release-unsigned.apk, and a hard-coded path silently checks nothing.
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "checking $APK"
          SIZE=$(unzip -p "$APK" assets/u2netp.onnx | wc -c)
          echo "assets/u2netp.onnx = $SIZE bytes"
          [ "$SIZE" -gt 4000000 ] || { echo '::error::u2netp.onnx missing or truncated'; exit 1; }
          LIBS=$(unzip -l "$APK" | grep -oE 'lib/[^/]+/libonnxruntime\.so' | sort -u)
          echo "$LIBS"
          [ "$LIBS" = "lib/arm64-v8a/libonnxruntime.so" ] \
            || { echo '::error::expected exactly one arm64-v8a libonnxruntime.so'; exit 1; }
          echo "release APK is $(du -h "$APK" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BrightCollect-check-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
